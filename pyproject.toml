[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "branchy-chat"
version = "0.3.0"
description = "Branching conversation trees for AI chat. Store, retrieve, and route conversations with tree-based memory."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12.5",
    "litellm>=1.103,<2",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
authors = [
    {name = "Bhasker Raju", email = "saibhaskerraju@outlook.com"}
]
maintainers = [
    {name = "Bhasker Raju", email = "saibhaskerraju@outlook.com"}
]
keywords = ["conversation", "tree", "chat", "llm", "branching"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
